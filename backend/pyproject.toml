[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-sql-platform"
version = "1.0.0"
description = "Multi-Tenant Text-to-SQL and Document Chat Platform"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",

    # Data Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Authentication & Security
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=44.0.0",

    # AI / LLM
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.50.0",
    "tiktoken>=0.8.0",

    # SQL
    "sqlglot>=25.0.0",

    # Document Parsing
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "unstructured>=0.16.0",

    # Storage
    "minio>=7.2.0",

    # Cache & Queue
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Observability
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",

    # DB Adapters
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "pyodbc>=5.2.0",
    "aiofiles>=24.1.0",

    # Utilities
    "python-slugify>=8.0.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
oracle = [
    "python-oracledb>=2.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
